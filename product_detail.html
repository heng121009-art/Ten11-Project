      <div
        class="grid grid-cols-1 gap-[34px] min-[601px]:grid-cols-2 min-[601px]:gap-x-8 min-[601px]:gap-y-10 min-[1101px]:grid-cols-4">

  <script>
/* TEN11 shopping bag + wishlist drawer (shared logic, inlined in each page) */
(function () {
  const KEY = 'ten11_cart', WKEY = 'ten11_wish', MAX = 10;
  const ALL_SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
  const cents = n => Math.round(n * 100);
  const money = c => '$' + (c / 100).toFixed(2);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const read = k => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

  let items = read(KEY), wish = read(WKEY), tab = 'bag';
  const save = () => { write(KEY, items); write(WKEY, wish); };

  document.body.insertAdjacentHTML('beforeend', `
  <div id="cartOverlay" class="pointer-events-none fixed inset-0 z-[3000] bg-black/50 opacity-0 transition-opacity duration-300"></div>
  <aside id="cartDrawer" aria-label="Shopping bag" aria-hidden="true"
    class="fixed right-0 top-0 z-[3001] flex h-full w-full max-w-[560px] translate-x-full flex-col overflow-y-auto bg-white shadow-2xl transition-transform duration-300">
    <div class="sticky top-0 z-10 flex shrink-0 items-center bg-white">
      <div class="grid flex-1 grid-cols-2">
        <button data-tab="bag" class="mx-4 flex items-center justify-center gap-2 border-b-2 py-4 text-[19px] font-medium"></button>
        <button data-tab="wish" class="mx-4 flex items-center justify-center gap-2 border-b-2 py-4 text-[19px] font-medium"></button>
      </div>
      <button id="cartClose" aria-label="Close" class="mr-3 flex h-10 w-10 items-center justify-center rounded-full hover:bg-neutral-100"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div id="cartBody" class="flex-1"></div>
  </aside>`);

  const $ = s => document.querySelector(s);
  const overlay = $('#cartOverlay'), drawer = $('#cartDrawer'), body = $('#cartBody');

  function open(t) {
    if (t) tab = t;
    render();
    drawer.classList.remove('translate-x-full');
    overlay.classList.remove('pointer-events-none', 'opacity-0');
    drawer.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    drawer.classList.add('translate-x-full');
    overlay.classList.add('pointer-events-none', 'opacity-0');
    drawer.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  const pill = n => `<span class="inline-flex h-7 min-w-[28px] items-center justify-center rounded-full bg-neutral-100 px-2 text-[15px] font-normal text-neutral-600">${n}</span>`;
  const badge = `<span class="mb-1.5 inline-flex w-fit items-center gap-1.5 rounded-full bg-[#1f2937] px-2.5 py-1 text-xs font-semibold text-white"><i class="fa-solid fa-sun text-[#ffd54f]"></i> New In</span>`;

  const totalQty = () => items.reduce((s, i) => s + i.qty, 0);
  let pending = 0;                       // adds still flying to the bag icon
  function updateBadge() {
    const n = totalQty();
    document.querySelectorAll('button[aria-label="Bag"] span').forEach(b => {
      b.textContent = n; b.style.display = n ? '' : 'none';
    });
  }

  /* Fly a copy of the product photo to the bag icon in the navbar */
  function fly(src) {
    const bag = document.querySelector('button[aria-label="Bag"]');
    if (!src || !bag || !src.getBoundingClientRect || !src.animate) return Promise.resolve();
    const a = src.getBoundingClientRect(), t = bag.getBoundingClientRect();
    const w = 110, h = 147;
    const top = Math.max(a.top, 0), bottom = Math.min(a.bottom, innerHeight);
    const cx = Math.min(Math.max(a.left + a.width / 2, 0), innerWidth);
    const cy = (top + Math.max(bottom, top)) / 2;
    const dx = t.left + t.width / 2 - cx, dy = t.top + t.height / 2 - cy;
    const el = document.createElement('img');
    el.src = src.currentSrc || src.src;
    el.style.cssText = `position:fixed;left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;` +
      'object-fit:cover;object-position:top;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:4000;pointer-events:none;';
    document.body.appendChild(el);
    const anim = el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px,${dy * 0.5 - 70}px) scale(.55)`, opacity: .95, offset: .55 },
      { transform: `translate(${dx}px,${dy}px) scale(.1)`, opacity: .35 }
    ], { duration: 750, easing: 'ease-in-out', fill: 'forwards' });
    return new Promise(res => { anim.onfinish = anim.oncancel = () => { el.remove(); res(); }; });
  }
  function bounce() {
    document.querySelectorAll('button[aria-label="Bag"]').forEach(b =>
      b.animate && b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' }));
  }

  function render() {
    const count = totalQty();
    let list = 0, saved = 0;
    items.forEach(i => {
      const old = Math.max(cents(i.oldPrice || i.price), cents(i.price));
      list += old * i.qty;
      saved += (old - cents(i.price)) * i.qty;
    });
    const pay = list - saved;

    if (!pending) updateBadge();

    // tabs
    document.querySelectorAll('[data-tab]').forEach(t => {
      const on = t.dataset.tab === tab;
      t.className = 'mx-4 flex items-center justify-center gap-2 border-b-2 py-4 text-[19px] font-medium ' + (on ? 'border-neutral-400 text-[#111]' : 'border-transparent text-[#111]');
      t.innerHTML = (t.dataset.tab === 'bag' ? 'Bag ' + pill(count) : 'Wishlist ' + pill(wish.length));
    });

    if (tab === 'wish') return renderWish();

    if (!items.length) {
      body.innerHTML = `
        <div class="flex flex-col items-center gap-3 px-6 py-24 text-center text-neutral-500">
          <i class="fa-solid fa-bag-shopping text-5xl text-neutral-300"></i>
          <p class="text-lg">Your bag is empty.</p>
          <button data-act="close" class="mt-2 h-12 w-full max-w-[320px] rounded-lg bg-[#222] text-[16px] font-semibold text-white hover:bg-black">Continue shopping</button>
        </div>`;
      return;
    }

    body.innerHTML = items.map((it, k) => {
      const sizes = (it.sizes && it.sizes.length) ? it.sizes : ALL_SIZES;
      const line = cents(it.price) * it.qty;
      const sale = it.oldPrice > it.price;
      return `
      <div class="flex gap-4 border-b border-neutral-100 px-4 py-5" data-k="${k}">
        <div class="w-[137px] shrink-0">
          <a href="product_detail.html?id=${it.id}"><img src="${esc(it.image)}" alt="${esc(it.name)}" class="h-[183px] w-full bg-neutral-100 object-cover object-top"></a>
          <button data-act="wish" class="mt-2 flex items-center gap-1.5 text-[14px] text-[#e53935] hover:underline"><i class="fa-regular fa-heart"></i> Move to wishlist</button>
        </div>
        <div class="relative flex min-w-0 flex-1 flex-col">
          <button data-act="remove" aria-label="Remove item" class="absolute right-0 top-0 text-xl text-[#e53935]"><i class="fa-regular fa-trash-can"></i></button>
          ${badge}
          <a href="product_detail.html?id=${it.id}" class="pr-8 text-[18px] leading-snug text-neutral-800 hover:underline">${esc(it.name)}</a>
          <div class="mt-3 flex gap-5">
            <label class="text-[13px] text-neutral-600">Size:
              <select data-act="size" class="mt-1 block h-10 w-[84px] rounded border border-neutral-300 bg-white px-2 text-[15px] text-[#111]">
                ${sizes.map(s => `<option ${s === it.size ? 'selected' : ''}>${esc(s)}</option>`).join('')}
              </select></label>
            <label class="text-[13px] text-neutral-600">Quantity:
              <select data-act="qty" class="mt-1 block h-10 w-[84px] rounded border border-neutral-300 bg-white px-2 text-[15px] text-[#111]">
                ${Array.from({ length: MAX }, (_, n) => `<option ${n + 1 === it.qty ? 'selected' : ''}>${n + 1}</option>`).join('')}
              </select></label>
          </div>
          <div class="mt-auto pt-3 text-right">
            ${sale ? `<span class="mr-2 text-sm text-neutral-400 line-through">${money(cents(it.oldPrice) * it.qty)}</span>` : ''}
            <span class="text-[20px] font-medium">${money(line)}</span>
          </div>
        </div>
      </div>`;
    }).join('') + `
      <div class="h-2 bg-neutral-100"></div>
      <div class="flex items-center justify-between border-b border-neutral-200 px-4 py-4 text-[22px] font-semibold"><span>Amount to pay</span><span>${money(pay)}</span></div>
      <div class="flex flex-col gap-2 px-4 py-4 text-[17px]">
        <div class="flex justify-between"><span>Total</span><span>${money(list)}</span></div>
        <div class="flex justify-between"><span>Save</span><span>${saved ? money(saved) : '$0'}</span></div>
      </div>
      <div class="px-4 pb-8">
        <button data-act="checkout" class="h-[52px] w-full rounded-lg bg-[#222] text-[19px] font-semibold text-white shadow-md hover:bg-black">Checkout</button>
      </div>`;
  }

  function renderWish() {
    if (!wish.length) {
      body.innerHTML = `
        <div class="flex flex-col items-center gap-3 px-6 py-24 text-center text-neutral-500">
          <i class="fa-regular fa-heart text-5xl text-neutral-300"></i>
          <p class="text-lg">Your wishlist is empty.</p>
        </div>`;
      return;
    }
    body.innerHTML = wish.map((it, k) => `
      <div class="flex gap-4 border-b border-neutral-100 px-4 py-5" data-w="${k}">
        <a href="product_detail.html?id=${it.id}" class="w-[110px] shrink-0"><img src="${esc(it.image)}" alt="${esc(it.name)}" class="h-[147px] w-full bg-neutral-100 object-cover object-top"></a>
        <div class="relative flex min-w-0 flex-1 flex-col">
          <button data-act="wremove" aria-label="Remove" class="absolute right-0 top-0 text-xl text-[#e53935]"><i class="fa-regular fa-trash-can"></i></button>
          <a href="product_detail.html?id=${it.id}" class="pr-8 text-[17px] leading-snug text-neutral-800 hover:underline">${esc(it.name)}</a>
          <p class="mt-1 text-[13px] text-neutral-500">Size: ${esc(it.size)}</p>
          <p class="mt-1 text-[18px] font-medium">${money(cents(it.price))}</p>
          <button data-act="wtobag" class="mt-auto h-11 w-full rounded-lg bg-[#222] text-[15px] font-semibold text-white hover:bg-black">Move to bag</button>
        </div>
      </div>`).join('');
  }

  const addToBag = item => {
    const f = items.find(i => i.id === item.id && i.size === item.size);
    if (f) f.qty = Math.min(MAX, f.qty + item.qty);
    else items.push({ ...item, qty: Math.min(MAX, item.qty) });
  };
  function add(item, srcEl) {
    addToBag(item); tab = 'bag'; save();
    pending++; render();
    fly(srcEl).then(() => { pending--; updateBadge(); bounce(); });
  }

  drawer.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (t) { tab = t.dataset.tab; return render(); }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'close') return close();
    if (act === 'checkout') return;                       // link your checkout page here
    const rowB = btn.closest('[data-k]'), rowW = btn.closest('[data-w]');
    if (rowB) {
      const k = +rowB.dataset.k, it = items[k];
      if (act === 'remove') items.splice(k, 1);
      if (act === 'wish') { items.splice(k, 1); if (!wish.some(w => w.id === it.id && w.size === it.size)) wish.push({ ...it, qty: 1 }); }
    } else if (rowW) {
      const k = +rowW.dataset.w, it = wish[k];
      if (act === 'wremove') wish.splice(k, 1);
      if (act === 'wtobag') { wish.splice(k, 1); addToBag({ ...it, qty: 1 }); tab = 'bag'; }
    }
    save(); render();
  });

  drawer.addEventListener('change', e => {
    const sel = e.target.closest('select[data-act]');
    const row = sel && sel.closest('[data-k]');
    if (!row) return;
    const k = +row.dataset.k, it = items[k];
    if (sel.dataset.act === 'qty') it.qty = +sel.value;
    if (sel.dataset.act === 'size') {
      it.size = sel.value;
      const j = items.findIndex((o, n) => n !== k && o.id === it.id && o.size === it.size);
      if (j > -1) { items[j].qty = Math.min(MAX, items[j].qty + it.qty); items.splice(k, 1); }
    }
    save(); render();
  });

  $('#cartClose').addEventListener('click', close);
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  addEventListener('storage', e => { if (e.key === KEY || e.key === WKEY) { items = read(KEY); wish = read(WKEY); render(); } });
  document.querySelectorAll('button[aria-label="Bag"]').forEach(b => b.addEventListener('click', () => open('bag')));

  render();
  window.Cart = { add, open, close, items: () => items.slice() };
})();

  </script>
  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const money = n => '$' + n.toFixed(2);
    const pct = (p, o) => '-' + Math.round((1 - p / o) * 100) + '%';

    /* ---------- Navbar dropdown, search, footer links ---------- */
    const h = (sel, html) => ($(sel).innerHTML = html);
    const menu = {
      'New In': ['New Arrivals', 'Just Dropped', 'Trending Now', 'Limited Edition'],
      'Clothing': ['T-Shirts', 'Shirts', 'Jackets', 'Pants', 'Hoodies'],
      'Accessories': ['Bags', 'Hats', 'Belts', 'Jewelry', 'Sunglasses'],
      'Shoes': ['Sneakers', 'Boots', 'Sandals', 'Formal'],
      'Collections': ['Summer 2026', 'Essentials', 'Collaboration', 'Archive']
    };
    h('#navMenu', Object.entries(menu).map(([k, v]) => `
  <li class="group relative">
    <a href="#" class="flex cursor-pointer items-center gap-1.5 px-[18px] py-3.5 text-sm font-medium text-neutral-800 transition-colors group-hover:text-black">
      ${k} <i class="fa-solid fa-chevron-down text-[11px] transition-transform group-hover:rotate-180"></i></a>
    <div class="invisible absolute left-1/2 top-full z-[100] min-w-[200px] -translate-x-1/2 rounded-lg border border-neutral-100 bg-white py-2 opacity-0 shadow-[0_8px_24px_rgba(0,0,0,.1)] transition-all duration-200 group-hover:visible group-hover:opacity-100">
      ${v.map(x => `<a href="#" class="block px-5 py-2.5 text-sm text-neutral-700 hover:bg-neutral-100 hover:text-black">${x}</a>`).join('')}
    </div>
  </li>`).join(''));

    /* ---------- Search dropdown (click the search icon) ---------- */
    (function () {
      const sw = $('#searchWrap');
      const POPULAR = ['T-Shirt', 'Denim', 'Jeans', 'Tank', 'Graphic'];
      const GROUP = { tops: 'tops', bestSeller: 'best seller', bottoms: 'bottoms' };

        const open = body.classList.contains('open');
        document.querySelectorAll('.acc-body').forEach(b => b.classList.remove('open'));
        document.querySelectorAll('.acc-chevron').forEach(c => c.classList.remove('rotated'));
        if (!open) { body.classList.add('open'); chev.classList.add('rotated'); }
      }));
    }
  </script>
</body>

</html>
